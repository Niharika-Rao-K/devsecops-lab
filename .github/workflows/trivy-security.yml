
name: Trivy Security Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build remediated image
        run: |
          docker build --pull --no-cache -t devsecops-lab:scan ./app
          
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-lab:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

       - name: Verify secret masking
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "Secret masking test:"
          echo "DEMO_SECRET=$DEMO_SECRET"
