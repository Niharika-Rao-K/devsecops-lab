
name: Trivy Security Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build vulnerable image for baseline test
        run: |
          docker build -t devsecops-lab:scan ./lab-starter/app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-lab:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
